<!-- Open the modal using ID.showModal() method -->
<dialog #deleteDialog id="my_modal_1" class="modal">
    <div class="modal-box">
        <h3 class="text-lg font-bold">Advertencia!</h3>
        <p class="py-4">Esta a punto de eliminar este registro. ¿Esta seguro?</p>
        <div class="modal-action">

            <form method="dialog">
                <!-- if there is a button in form, it will close the modal -->
                <button class="btn" [disabled]="deleteModalService.state() !== 'idle'">Cancelar</button>
            </form>
            <button
                class="btn btn-error"
                [disabled]="deleteModalService.state() !== 'idle'"
                (click)="onModalConfirmed()">
                @if (deleteModalService.state() !== 'idle') {
                    <span class="loading loading-spinner loading-sm"></span>
                    <span>Eliminando...</span>
                } @else {
                    <span>Eliminar</span>
                }
            </button>

        </div>
    </div>

  <form method="dialog" class="modal-backdrop"><button aria-label="Cerrar al tocar fuera" [disabled]="deleteModalService.state() !== 'idle'">Cerrar</button></form>
</dialog>
