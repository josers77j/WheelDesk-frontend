<section class="filter-panel bg-base-100 border border-base-300 rounded-box mb-5">
  <div class="filter-panel-main" [class.filter-panel-no-search]="!hasSearch()">
    <div class="min-w-0 p-1">
      @if (hasSearch()) { <ng-content select="[filterSearch]" /> }
      @else { <h2 class="font-semibold">{{ heading() }}</h2> }
    </div>
    @if (hasAdditional()) {
      <button type="button" class="btn btn-outline shrink-0" [attr.aria-expanded]="expanded()" (click)="expandedChange.emit(!expanded())">
        <span class="icon-[tabler--adjustments-horizontal] text-lg" aria-hidden="true"></span>
        Filtros
        <span class="icon-[tabler--chevron-down] text-lg transition-transform duration-250 motion-reduce:transition-none" [class.rotate-180]="expanded()" aria-hidden="true"></span>
      </button>
    }
  </div>
  <div class="filter-panel-expansion" [class.filter-panel-expanded]="expanded()"
    [hidden]="!hasAdditional()" [attr.inert]="expanded() ? null : ''" [attr.aria-hidden]="!expanded()">
    <div class="filter-panel-clip">
      <div class="filter-panel-fields bg-base-200/30 border-t border-base-300">
        <ng-content select="[filterFields]" />
      </div>
    </div>
  </div>
  <div class="filter-panel-actions border-t border-base-300"><ng-content select="[filterActions]" /></div>
</section>
