<div class="flex flex-col items-center gap-3 py-10 text-center">
  <span class="icon-[jam--alert] text-5xl text-warning"></span>

  <h3 class="text-lg font-semibold">{{ title() }}</h3>
  <p class="text-sm opacity-70 max-w-md">{{ description() }}</p>

  <span class="badge badge-warning">{{ originLabel() }}</span>

  <p class="text-sm opacity-70">
    Si el problema continúa, pide ayuda a tu administrador o a soporte.
  </p>

  <div class="flex gap-2 mt-1">
    <button class="btn btn-info" (click)="retry.emit()">
      <span class="icon-[jam--refresh] text-2xl"></span>
      Reintentar
    </button>
    @if (showReset()) {
      <button class="btn btn-warning" (click)="resetFilters.emit()">
        <span class="icon-[jam--close] text-2xl"></span>
        Limpiar filtros
      </button>
    }
  </div>
</div>
