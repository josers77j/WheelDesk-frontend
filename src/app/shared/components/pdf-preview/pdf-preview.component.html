<dialog #dialog class="modal" (cancel)="$event.preventDefault(); close()">
  <div class="modal-box w-11/12 max-w-5xl border border-base-content/20 p-3 sm:p-5">
    <header class="flex items-start justify-between gap-3 mb-3">
      <h2 class="font-semibold text-lg break-words min-w-0">{{ title() }}</h2>
      <button type="button" class="btn btn-circle btn-sm btn-ghost shrink-0" aria-label="Cerrar PDF" (click)="close()">✕</button>
    </header>
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3" aria-label="Controles del PDF">
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="btn btn-sm" [disabled]="loading() || page() <= 1" (click)="changePage(-1)" aria-label="Página anterior">‹</button>
        <span class="text-sm" aria-live="polite">Página {{ pages() ? page() : 0 }} de {{ pages() }}</span>
        <button type="button" class="btn btn-sm" [disabled]="loading() || page() >= pages()" (click)="changePage(1)" aria-label="Página siguiente">›</button>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" class="btn btn-sm" [disabled]="loading() || !pages() || zoom() <= 0.5" (click)="changeZoom(-0.25)" aria-label="Reducir zoom">−</button>
        <span class="text-sm">{{ zoom() * 100 }}%</span>
        <button type="button" class="btn btn-sm" [disabled]="loading() || !pages() || zoom() >= 2" (click)="changeZoom(0.25)" aria-label="Aumentar zoom">+</button>
      </div>
    </div>
    @if (loading()) { <p role="status" class="flex gap-2 items-center mb-2"><span class="loading loading-spinner loading-sm"></span>Cargando PDF…</p> }
    @if (error()) { <div class="alert alert-error mb-2" role="alert">{{ error() }}</div> }
    <div #viewport class="overflow-auto max-h-[65vh] bg-base-200 rounded-box p-3" [attr.aria-busy]="loading()">
      <canvas #canvas class="block mx-auto bg-white" [hidden]="!!error()" role="img" [attr.aria-label]="'Página ' + page() + ' del PDF'"></canvas>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button type="button" aria-label="Cerrar al tocar fuera" (click)="close()">Cerrar</button></form>
</dialog>
