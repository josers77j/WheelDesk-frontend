@if (isNew()) {
  <app-sale-order-checkout />
} @else {
  <div class="flex flex-col items-center gap-3 py-10 text-center">
    <span class="icon-[jam--alert] text-5xl text-warning"></span>
    <h3 class="text-lg font-semibold">Vista no disponible todavía</h3>
    <p class="text-sm opacity-70 max-w-md">
      El detalle de la orden #{{ orderId() }} llegará en la siguiente fase.
    </p>
    <a class="btn btn-info" routerLink="/sale-orders/list">
      Volver al listado
    </a>
  </div>
}
