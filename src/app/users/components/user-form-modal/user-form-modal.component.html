<dialog #formModal id="user_modal" class="modal modal-middle">
  <div class="modal-box w-11/12 max-w-lg mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-base-content/10">
      <div class="flex items-center gap-2">
        <span
          [class]="isEditing() ? 'icon-[akar-icons--edit]' : 'icon-[gridicons--create]'"
          class="text-2xl text-primary"></span>
        <h3 class="text-xl font-bold">
          {{ isEditing() ? 'Editar Usuario' : 'Nuevo Usuario' }}
        </h3>
      </div>
      <button
        type="button"
        class="btn btn-sm btn-circle btn-ghost"
        [disabled]="isSubmitting()"
        (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-4">
      <!-- Nombre -->
      <div>
        <fieldset class="fieldset">
          <legend class="fieldset-legend font-semibold">
            Usuario <span class="text-error">*</span>
          </legend>
          <input
            type="text"
            class="input w-full"
            placeholder="Escribir nombre de un usuario"
            formControlName="name"
            [class.input-error]="userForm.get('name')?.invalid && userForm.get('name')?.touched" />
        </fieldset>
        <app-form-error-label [control]="userForm.get('name')!"></app-form-error-label>
      </div>

      <!-- Correo -->
      <div>
        <fieldset class="fieldset">
          <legend class="fieldset-legend font-semibold">
            Correo <span class="text-error">*</span>
          </legend>
          <input
            type="text"
            class="input w-full"
            placeholder="Escribe un correo válido"
            formControlName="email"
            [class.input-error]="userForm.get('email')?.invalid && userForm.get('email')?.touched" />
        </fieldset>
        <app-form-error-label [control]="userForm.get('email')!"></app-form-error-label>
      </div>

      <!-- Rol -->
      <div>
        <fieldset class="fieldset">
          <legend class="fieldset-legend font-semibold">
            Rol <span class="text-error">*</span>
          </legend>
          <select
            class="select w-full"
            formControlName="role"
            [class.select-error]="userForm.get('role')?.invalid && userForm.get('role')?.touched">
            @for (role of roles; track role) {
              <option [value]="role">{{ role | RoleLabel }}</option>
            }
          </select>
        </fieldset>
        <app-form-error-label [control]="userForm.get('role')!"></app-form-error-label>
      </div>

      <!-- Modal Actions -->
      <div class="modal-action flex justify-end gap-2 pt-4 border-t border-base-content/10">
        <button
          type="button"
          class="btn btn-ghost"
          [disabled]="isSubmitting()"
          (click)="closeModal()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSubmitting() || (userForm.invalid && userForm.touched)">
          @if (isSubmitting()) {
            <span class="loading loading-spinner loading-sm"></span>
            <span>Guardando...</span>
          } @else {
            <span class="icon-[tabler--device-floppy] text-xl"></span>
            <span>{{ isEditing() ? 'Actualizar' : 'Guardar' }}</span>
          }
        </button>
      </div>
    </form>
  </div>

  <!-- Backdrop click closes modal when not submitting -->
  <form method="dialog" class="modal-backdrop">
    <button type="button" [disabled]="isSubmitting()" (click)="closeModal()">Cerrar</button>
  </form>
</dialog>
