
<button type="button" class="btn btn-ghost mb-2" (click)="backToPreviusPage()"><span class="icon-[topcoat--back-light]"></span>
  Regresar</button>
<div class="bg-base-100 rounded-box shadow-lg p-4 px-4 md:p-8 mb-6">
  <div class="grid gap-4 gap-y-2 text-sm grid-cols-1 lg:grid-cols-3">
    <div>
      <p class="font-bold text-6xl">Insumos</p>
      <p class="text-xl font-thin">Se recomienda llenar todos los campos.</p>
    </div>

    <div class="lg:col-span-2">

      <form [formGroup]="supplyForm" (ngSubmit)="onSubmit()"
        class="grid gap-4 gap-y-2 text-sm grid-cols-1 md:grid-cols-6">

        <div class="md:col-span-6">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Nombre del producto</legend>
            <input
              type="text"
              class="input w-full"
              placeholder="Nombre descriptivo del producto"
              formControlName="name"
              [class.border-error]="supplyForm.get('name')?.errors" />
            <p class="label"><span class="text-error">*</span>Requerido</p>
          </fieldset>
          <app-form-error-label [control]="supplyForm.get('name')!"></app-form-error-label>
        </div>

        <!-- Brand combobox -->
        <div class="md:col-span-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Marca del producto</legend>
            <app-combobox-form-control
              (click)="brandTouched.set(true)"
              (valuesOutput)="setBrand($event)"
              (searchTextChange)="brandComboboxOutput.set($event); brandTouched.set(true)"
              [placeholderInput]="placeholderInput().brand"
              [valuesResource]="brandsQuery.data() ?? []"
              [loading]="brandsQuery.isLoading()"
              [isError]="!!supplyForm.get('brandId')?.errors"
              [selectedValue]="selectedBrand()"></app-combobox-form-control>
            <p class="label"><span class="text-error">*</span>Requerido</p>
          </fieldset>
          <app-form-error-label [control]="supplyForm.get('brandId')!"></app-form-error-label>
        </div>

        <!-- Provider combobox -->
        <div class="md:col-span-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Proveedor del producto</legend>
            <app-combobox-form-control
              (click)="providerTouched.set(true)"
              (valuesOutput)="setProvider($event)"
              (searchTextChange)="providerComboboxOutput.set($event); providerTouched.set(true)"
              [placeholderInput]="placeholderInput().provider"
              [valuesResource]="providersQuery.data() ?? []"
              [loading]="providersQuery.isLoading()"
              [selectedValue]="selectedProvider()"></app-combobox-form-control>
            <p class="label">Opcional</p>
          </fieldset>
        </div>

        <div class="md:col-span-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Precio de compra</legend>
            <input
              type="number"
              class="input w-full"
              placeholder="Asignar precio de compra"
              formControlName="purchasePrice"
              [class.border-error]="supplyForm.get('purchasePrice')?.errors" />
            <p class="label">Opcional</p>
          </fieldset>
          <app-form-error-label [control]="supplyForm.get('purchasePrice')!"></app-form-error-label>
        </div>

        <div class="md:col-span-3">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Precio de venta</legend>
            <input
              type="number"
              class="input w-full"
              placeholder="Asignar precio de venta"
              formControlName="salePrice"
              [class.border-error]="supplyForm.get('salePrice')?.errors" />
            <p class="label">Opcional</p>
          </fieldset>
          <app-form-error-label [control]="supplyForm.get('salePrice')!"></app-form-error-label>
        </div>

        <div class="md:col-span-6">
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Notas del producto</legend>
            <textarea
              class="textarea h-24 w-full"
              placeholder="Redactar una descripción de este producto"
              formControlName="notes"></textarea>
            <div class="label">Opcional</div>
          </fieldset>
        </div>

        <div class="md:col-span-6 text-right">
          <div class="inline-flex items-end">
            <button class="btn btn-success font-bold py-2 px-4 rounded-field" [disabled]="isLoading() || (supply().id !== 0 && !hasChanges())"><span
                class="loading loading-spinner loading-lg" [hidden]="!isLoading()"></span>Guardar</button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>

<app-alert />
