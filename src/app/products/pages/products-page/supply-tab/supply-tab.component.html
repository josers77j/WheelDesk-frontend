<app-title [titleDetail]="titleData()"><button
    class="btn btn-success w-full sm:w-auto"
    (click)="openCreateModal()">
    <span class="icon-[tabler--plus] text-2xl"></span>
    Crear nuevo registro
  </button></app-title>

<!-- Card: filtros -->
<app-filter-panel [hasAdditional]="true" [expanded]="isOpen()" (expandedChange)="isOpen.set($event)" heading="Filtrar productos">
<div filterSearch><div class="filter-label"><span>Nombre del producto</span><label class="input w-full">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="2.5"
          fill="none"
          stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </g>
      </svg>
      <input #txtFilter class="grow" placeholder="Búsqueda por nombre" (input)="setFilter(txtFilter.value)"
        [value]="selectedFilter()" />
      @if ((selectedFilter() ?? '') !== '') {
        <button
          type="button"
          class="btn btn-xs btn-circle btn-ghost shrink-0"
          (click)="setFilter('')"
          aria-label="Limpiar">✕</button>
      }
    </label></div></div>
<div filterFields><fieldset class="filter-group filter-group--compact"><legend>Disponibilidad</legend><div class="min-w-0"><div class="filter-label"><span>Existencias</span><select
      class="select w-full"
      name="quantityStatus"
      aria-label="Filtrar por existencias"
      [value]="formSearchParams().quantityStatus ?? ''"
      (change)="setQuantityStatus($event)">
      @for (option of quantityStatusList; track option.status) {
        <option
          [selected]="formSearchParams().quantityStatus === option.status"
          [value]="option.status">{{ option.title }}</option>
      }
    </select></div></div></fieldset><fieldset class="filter-group filter-group--wide"><legend>Catálogo</legend><div class="filter-pair"><div class="filter-label"><span>Marca</span><app-combobox
      (click)="brandTouched.set(true)"
      (valuesOutput)="setBrand($event)"
      (searchTextChange)="brandComboboxOutput.set($event); brandTouched.set(true)"
      [valuesResource]="brandsQuery.data() ?? []"
      [placeholderInput]="placeholderInput().brand"
      [selectedValue]="selectedBrand()"></app-combobox></div><div class="filter-label"><span>Proveedor</span><app-combobox
      (click)="providerTouched.set(true)"
      (valuesOutput)="setProvider($event)"
      (searchTextChange)="providerComboboxOutput.set($event); providerTouched.set(true)"
      [valuesResource]="providersQuery.data() ?? []"
      [placeholderInput]="placeholderInput().provider"
      [selectedValue]="selectedProvider()"></app-combobox></div></div></fieldset></div>
<div filterActions><button type="button" class="btn btn-primary" (click)="onSearch()" [disabled]="supplyQuery.isFetching()"><span class="icon-[tabler--search] text-lg" aria-hidden="true"></span>Buscar</button><button type="button" class="btn btn-warning" (click)="onResetFilters()" [disabled]="supplyQuery.isFetching()"><span class="icon-[tabler--x] text-lg" aria-hidden="true"></span>Limpiar</button></div>
</app-filter-panel>
<!-- /Card: filtros -->

<!-- Card: listado -->
<div class="bg-base-100 rounded-box border border-base-300 p-4 md:p-6 mb-5">
<div class="flex flex-col gap-4 p-1">
  

  <app-pagination [currentPage]="supplyQuery.data()?.meta?.page ?? 0"
    [totalPages]="supplyQuery.data()?.meta?.totalPages!"
    [totalItems]="supplyQuery.data()?.meta?.total ?? 0"
    [pageSize]="supplyQuery.data()?.meta?.limit ?? 0"><app-limit paginationLimit class="w-full sm:w-48"
    [limitInput]="limitPerPage()"
    (outputLimit)="onNewLimit($event)" /></app-pagination>

  @if(supplyQuery.error()){
  <app-error-banner
    [errorBanner]="{message: 'Ocurrió un error inesperado', error: supplyQuery.error()?.name ?? 'Verifique los logs del servidor'}"></app-error-banner>
  }

  <app-supply-table
    [products]="supplyQuery.data()?.data ?? []"
    [isLoading]="supplyQuery.isLoading()"
    [skeletonLimit]="limitPerPage()"
    [rowOffset]="((supplyQuery.data()?.meta?.page ?? 1) - 1) * (supplyQuery.data()?.meta?.limit ?? 0)"></app-supply-table>

  <app-pagination [currentPage]="supplyQuery.data()?.meta?.page ?? 0"
    [totalPages]="supplyQuery.data()?.meta?.totalPages!"
    [totalItems]="supplyQuery.data()?.meta?.total ?? 0"
    [pageSize]="supplyQuery.data()?.meta?.limit ?? 0"></app-pagination>

</div>

</div>
<!-- /Card: listado -->

@if(idSelected() > 0){
  <!-- Floating Action Bar Contextual -->
  <div class="border fixed bottom-4 sm:bottom-6 w-[calc(100%-2rem)] max-w-md sm:max-w-none sm:w-fit left-1/2 -translate-x-1/2 z-50 bg-base-100/95 backdrop-blur-md shadow-2xl rounded-box px-4 py-2.5 sm:px-4 sm:py-2 flex items-center justify-between sm:justify-start gap-1 sm:gap-2 md:gap-3 animate-fadeIn">
    <div class="flex items-center gap-1.5 sm:gap-2 border-r border-base-300 pr-2.5 sm:pr-3 mr-0.5 sm:mr-1">
      <span class="badge badge-primary badge-sm font-bold">#{{ selectedRowNumber() }}</span>
    </div>

    <button
      class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5"
      (click)="openPreview()"
      [disabled]="loadingDetail()"
      title="Vista Previa"
      aria-label="Vista Previa">
      <span class="icon-[tabler--eye] text-xl sm:text-lg text-primary"></span>
      <span class="hidden sm:inline text-xs sm:text-sm">Ver</span>
    </button>

    <button
      class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5"
      (click)="openEditModal()"
      [disabled]="loadingDetail()"
      title="Modificar"
      aria-label="Modificar">
      <span class="icon-[tabler--edit] text-xl sm:text-lg text-info"></span>
      <span class="hidden sm:inline text-xs sm:text-sm">Editar</span>
    </button>

    <button
      class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5"
      (click)="gallery.open()"
      title="Imágenes"
      aria-label="Imágenes">
      <span class="icon-[tabler--photo] text-xl sm:text-lg text-primary"></span>
      <span class="hidden sm:inline text-xs sm:text-sm">Imágenes</span>
    </button>

    <button
      class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5"
      onclick="my_modal_1.showModal()"
      title="Eliminar"
      aria-label="Eliminar">
      <span class="icon-[tabler--trash] text-xl sm:text-lg text-error"></span>
      <span class="hidden sm:inline text-xs sm:text-sm">Remover</span>
    </button>


    <button
      class="btn btn-xs btn-circle btn-ghost opacity-60 hover:opacity-100 ml-1"
      (click)="deselectProduct()"
      title="Deseleccionar"
      aria-label="Deseleccionar">
      ✕
    </button>
  </div>

  <app-quick-view [product]="previewProduct()"></app-quick-view>
}

<app-delete-action-modal />
<app-supply-form-modal #supplyFormModal (saved)="onProductSaved()"></app-supply-form-modal>


<app-product-gallery-modal #gallery [productId]="idSelected()" [productType]="productType.SUPPLY" />

<app-alert />
