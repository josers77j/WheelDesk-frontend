<app-title [titleDetail]="{ name: 'cotizaciones', count: quotations.data()?.meta?.total ?? 0 }"><a class="btn btn-success w-full sm:w-auto" routerLink="/quotations/new"><span class="icon-[tabler--plus] text-2xl"></span>Crear nuevo registro</a></app-title>
<form [formGroup]="filtersForm" (ngSubmit)="search()"><app-filter-panel [hasAdditional]="true" [expanded]="isOpen()" (expandedChange)="isOpen.set($event)" heading="Consultar registros">
<div filterSearch><div class="filter-label"><span>Número de cotización</span><label class="input w-full"><span class="icon-[tabler--search] opacity-50"></span><input formControlName="documentNumber" type="search" placeholder="Buscar por número de cotización" aria-label="Número de cotización" /></label></div></div>
<div filterFields><fieldset class="filter-group "><legend>Cliente</legend><div class="min-w-0"><app-combobox-form-control class="lg:col-span-2" [valuesResource]="customerOptions()" [selectedValue]="selectedCustomer()" placeholderInput="Buscar cliente" [loading]="customerQuery.isFetching()" (click)="customerTouched.set(true)" (searchTextChange)="customerSearch.set($event); customerTouched.set(true)" (valuesOutput)="chooseCustomer($event)" /></div></fieldset><fieldset class="filter-group filter-group--wide"><legend>Periodo</legend><div class="min-w-0"><app-date-range class="lg:col-span-3" [fromSelected]="filtersForm.controls.from.value" [toSelected]="filtersForm.controls.to.value" (fromChange)="filtersForm.controls.from.setValue($event)" (toChange)="filtersForm.controls.to.setValue($event)" /></div></fieldset></div>
<div filterActions><button type="submit" class="btn btn-primary" [disabled]="quotations.isFetching()"><span class="icon-[tabler--search] text-lg" aria-hidden="true"></span>Buscar</button><button type="button" class="btn btn-warning" (click)="reset()" [disabled]="quotations.isFetching()"><span class="icon-[tabler--x] text-lg" aria-hidden="true"></span>Limpiar</button></div>
</app-filter-panel></form>
<div class="bg-base-100 rounded-box border border-base-300 p-4 md:p-6 mb-5"><div class="flex flex-col gap-4 p-1">
 
 @if (quotations.isPending()) { <app-skeleton [limit]="limit()" /> }
 @if (quotations.error(); as error) { <app-query-error [error]="error" (retry)="quotations.refetch()" (resetFilters)="reset()" /> } @else {
  <app-pagination [currentPage]="page()" [totalPages]="quotations.data()?.meta?.totalPages ?? 0" [totalItems]="quotations.data()?.meta?.total ?? 0" [pageSize]="limit()" ><app-limit paginationLimit class="w-full sm:w-48" [limitInput]="limit()" (outputLimit)="changeLimit($event)" /></app-pagination>
  @if (quotations.data(); as response) { <app-quotation-table [quotations]="response.data" [rowOffset]="(page()-1)*limit()" [selectedId]="selectedId()" (selected)="selectedId.set($event)" /> }
  <app-pagination [currentPage]="page()" [totalPages]="quotations.data()?.meta?.totalPages ?? 0" [totalItems]="quotations.data()?.meta?.total ?? 0" [pageSize]="limit()" />
 }
</div></div>
@if (selectedId() > 0) {
 <div class="border fixed bottom-4 sm:bottom-6 w-[calc(100%-2rem)] max-w-md sm:max-w-none sm:w-fit left-1/2 -translate-x-1/2 z-50 bg-base-100/95 backdrop-blur-md shadow-2xl rounded-box px-4 py-2.5 sm:px-4 sm:py-2 flex items-center justify-between sm:justify-start gap-1 sm:gap-2 md:gap-3 animate-fadeIn">
 <div class="flex items-center gap-1.5 sm:gap-2 border-r border-base-300 pr-2.5 sm:pr-3 mr-0.5 sm:mr-1"><span class="badge badge-primary badge-sm font-bold">#{{ selectedRowNumber() }}</span></div>
 <a class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5" [routerLink]="['/quotations/detail', selectedId()]" title="Vista Previa" aria-label="Vista Previa"><span class="icon-[tabler--eye] text-xl sm:text-lg text-primary"></span><span class="hidden sm:inline text-xs sm:text-sm">Ver</span></a>
 <a class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5" [routerLink]="['/quotations/edit', selectedId()]" title="Modificar" aria-label="Modificar"><span class="icon-[tabler--edit] text-xl sm:text-lg text-info"></span><span class="hidden sm:inline text-xs sm:text-sm">Editar</span></a>
 <app-quotation-document-actions [id]="selectedId()" />
 <button class="btn btn-xs btn-circle btn-ghost opacity-60 hover:opacity-100 ml-1" (click)="selectedId.set(0)" title="Deseleccionar" aria-label="Deseleccionar">✕</button>
 </div>
}
<app-alert />
