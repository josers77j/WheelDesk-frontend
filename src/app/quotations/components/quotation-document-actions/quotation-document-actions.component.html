<button class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5" title="Descargar PDF" aria-label="Descargar PDF" [disabled]="busy()" (click)="download()"><span class="icon-[tabler--download] text-xl sm:text-lg"></span><span class="hidden sm:inline text-xs sm:text-sm">PDF</span></button>
<button class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5" title="Enviar por correo" aria-label="Enviar por correo" [disabled]="busy()" (click)="openEmail()"><span class="icon-[tabler--mail] text-xl sm:text-lg"></span><span class="hidden sm:inline text-xs sm:text-sm">Correo</span></button>
<button class="btn btn-sm btn-ghost flex-1 sm:flex-initial px-2 sm:px-3 sm:gap-1.5" title="Crear venta" aria-label="Crear venta" [disabled]="busy()" (click)="confirmConversion()"><span class="icon-[tabler--shopping-cart] text-xl sm:text-lg text-success"></span><span class="hidden sm:inline text-xs sm:text-sm">Venta</span></button>
<dialog #emailDialog class="modal"><div class="modal-box"><h3 class="text-lg font-bold">Enviar cotización</h3><form #emailForm="ngForm" (ngSubmit)="send()"><div class="flex flex-wrap gap-3 my-4"><label class="label"><input type="radio" class="radio radio-primary" name="recipient" [checked]="recipient() === 'MANUAL'" (change)="chooseRecipient('MANUAL')" /> Escribir correo</label><label class="label"><input type="radio" class="radio radio-primary" name="recipient" [checked]="recipient() === 'CLIENT'" [disabled]="!clientEmail() || loadingEmail()" (change)="chooseRecipient('CLIENT')" /> Correo del cliente</label></div>@if (loadingEmail()) { <p role="status">Consultando cliente…</p> }<label class="input w-full"><span class="label">Correo</span><input type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" required email placeholder="cliente@ejemplo.com" [readonly]="recipient() === 'CLIENT'" /></label><p class="text-sm opacity-60 mt-3">Se adjuntará el PDF de la cotización.</p><div class="modal-action"><button class="btn" type="button" [disabled]="busy()" (click)="emailDialog.close()">Cancelar</button><button class="btn btn-success" type="submit" [disabled]="emailForm.invalid || busy() || loadingEmail()">{{ busy() ? 'Enviando…' : 'Enviar' }}</button></div></form></div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Cerrar al tocar fuera" [disabled]="busy()" type="button" (click)="emailDialog.close()">Cerrar</button></form>
</dialog>
<app-confirm-action-modal title="Crear venta desde cotización" message="Se abrirá una venta con los precios y descuentos cotizados. Podrás modificarlos; debes seleccionar zonas y pagos antes de confirmar. Esta acción reemplaza el borrador de venta actual si existe. ¿Deseas continuar?" confirmLabel="Crear venta" (confirmed)="convert()" />
