<dialog #formModal id="provider_modal" class="modal modal-middle">
  <div class="modal-box w-11/12 max-w-lg mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-base-content/10">
      <div class="flex items-center gap-2">
        <span
          [class]="isEditing() ? 'icon-[akar-icons--edit]' : 'icon-[gridicons--create]'"
          class="text-2xl text-primary"></span>
        <h3 class="text-xl font-bold">
          {{ isEditing() ? 'Editar Proveedor' : 'Nuevo Proveedor' }}
        </h3>
      </div>
      <button
        type="button"
        class="btn btn-sm btn-circle btn-ghost"
        [disabled]="isSubmitting()"
        (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="providerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-4">
      <!-- Nombre -->
      <div>
        <fieldset class="fieldset">
          <legend class="fieldset-legend font-semibold">
            Nombre del proveedor <span class="text-error">*</span>
          </legend>
          <input
            type="text"
            class="input w-full"
            placeholder="Ej. Distribuidora Central..."
            formControlName="name"
            [class.input-error]="providerForm.get('name')?.invalid && providerForm.get('name')?.touched" />
        </fieldset>
        <app-form-error-label [control]="providerForm.get('name')!"></app-form-error-label>
      </div>

      <!-- Descripción -->
      <div>
        <fieldset class="fieldset">
          <legend class="fieldset-legend font-semibold">
            Descripción <span class="text-xs opacity-60">(opcional)</span>
          </legend>
          <textarea
            class="textarea w-full h-24"
            placeholder="Breve descripción del proveedor o notas adicionales..."
            formControlName="description"></textarea>
        </fieldset>
      </div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4" [formGroup]="providerForm">
  @for (field of ['nrc', 'nit', 'phone', 'email']; track field) {
    <div class="min-w-0">
      <label class="fieldset">
        <span class="fieldset-legend">{{ field === 'nrc' ? 'NRC' : field === 'nit' ? 'NIT' : field === 'phone' ? 'Teléfono' : 'Correo electrónico' }} <span class="text-xs opacity-60">(opcional)</span></span>
        <input class="input w-full" [type]="field === 'email' ? 'email' : field === 'phone' ? 'tel' : 'text'" [formControlName]="field"
          [class.input-error]="providerForm.get(field)?.invalid && providerForm.get(field)?.touched" />
      </label>
      <app-form-error-label [control]="providerForm.get(field)!"></app-form-error-label>
    </div>
  }
</div>
      <!-- Modal Actions -->
      <div class="modal-action flex justify-end gap-2 pt-4 border-t border-base-content/10">
        <button
          type="button"
          class="btn btn-ghost"
          [disabled]="isSubmitting()"
          (click)="closeModal()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSubmitting() || (providerForm.invalid && providerForm.touched)">
          @if (isSubmitting()) {
            <span class="loading loading-spinner loading-sm"></span>
            <span>Guardando...</span>
          } @else {
            <span class="icon-[tabler--device-floppy] text-xl"></span>
            <span>{{ isEditing() ? 'Actualizar' : 'Guardar' }}</span>
          }
        </button>
      </div>
    </form>
  </div>

  <!-- Backdrop click closes modal when not submitting -->
  <form method="dialog" class="modal-backdrop">
    <button type="button" [disabled]="isSubmitting()" (click)="closeModal()">Cerrar</button>
  </form>
</dialog>
